<title>Goose Prototype v7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..700&family=Fraunces:opsz,wght@9..144,500..700&display=swap">
<script id="chartjs" async src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script id="xlsxjs" async src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: light top bar edged by a thin strata stripe; the home screen is a horizontal stratigraphic timeline of project lanes; task details rise as a bottom sheet */
:root{
  --sun:#F4CB5D;--sage:#6B9160;--moss:#5D7A4B;--ochre:#E5A957;
  --bg:#F6F7F2;--surface:#FFFFFF;--surface-2:#EEF1E8;--line:#DCE1D3;--fg:#1E2519;--muted:#626C5A;--faint:#98A18F;
  --accent:#4F6E3E;--accent-soft:#E2EBDA;--primary:#F4CB5D;--primary-hover:#EBBD45;--primary-fg:#2B2410;
  --danger:#B5482F;--warn:#B9771A;--ok:#4F7D3F;--quiet:#7A5535;
  --canvas:color-mix(in srgb,var(--bg) 91%,var(--fg));
  /* top bars: same as the surface unless a palette gives them their own colour */
  --bar-bg:var(--surface);--bar-fg:var(--fg);--bar-muted:var(--muted);--bar-line:var(--line);--bar-hi:var(--surface-2);--bar-on:var(--accent-soft);--bar-on-fg:var(--fg);--bar-field:var(--surface);
  --shadow:0 -10px 40px rgb(20 30 15 / .18);--shadow-s:0 2px 10px rgb(20 30 15 / .06);
  --raise:#FFFFFF;--raise-2:#F1F4EC;--raise-line:#CDD4C4;
  /* one content face everywhere inside the panels; a separate face for the brand and main navigation */
  --f-content:"Geologica",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:var(--f-content);--f-body:var(--f-content);--f-mono:var(--f-content);
  --f-nav:"Fraunces",ui-serif,Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12160F;--raise:#29321F;--raise-2:#323C28;--raise-line:#46523B;--surface:#191F16;--surface-2:#21281D;--line:#2F3929;--fg:#E5EBDD;--muted:#9EA996;--faint:#6D7866;
  --accent:#97BB88;--accent-soft:#25321F;--primary-hover:#F7D676;--danger:#E58468;--warn:#E5A957;--ok:#8DBA7B;--quiet:#9A7656;--canvas:color-mix(in srgb,var(--bg) 62%,#000);
  --shadow:0 -10px 40px rgb(0 0 0 / .6);--shadow-s:0 2px 10px rgb(0 0 0 / .3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12160F;--raise:#29321F;--raise-2:#323C28;--raise-line:#46523B;--surface:#191F16;--surface-2:#21281D;--line:#2F3929;--fg:#E5EBDD;--muted:#9EA996;--faint:#6D7866;
  --accent:#97BB88;--accent-soft:#25321F;--primary-hover:#F7D676;--danger:#E58468;--warn:#E5A957;--ok:#8DBA7B;--quiet:#9A7656;--canvas:color-mix(in srgb,var(--bg) 62%,#000);
  --shadow:0 -10px 40px rgb(0 0 0 / .6);--shadow-s:0 2px 10px rgb(0 0 0 / .3);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .overdue{color:var(--danger)} .soon{color:var(--ok)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.app{display:flex;flex-direction:column;height:100%}
/* top bar */
.bar{background:var(--bar-bg);color:var(--bar-fg);display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-nav);font-weight:700;font-size:19px;letter-spacing:-.01em;white-space:nowrap;font-variation-settings:"opsz" 36}
.logo{width:24px;height:24px;border-radius:6px;overflow:hidden;display:grid;grid-template-rows:4fr 2.6fr 1.8fr 1.6fr;flex:none}
.logo i:nth-child(1){background:var(--sun)}.logo i:nth-child(2){background:var(--sage)}.logo i:nth-child(3){background:var(--moss)}.logo i:nth-child(4){background:var(--ochre)}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.navsep{width:1px;align-self:stretch;margin:6px 4px;background:var(--bar-line)}
.navl{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:8px;color:var(--bar-muted);white-space:nowrap;font-family:var(--f-nav);font-size:15.5px;font-weight:500;font-variation-settings:"opsz" 24}
.navl:hover{color:var(--bar-fg);background:var(--bar-hi)}
.navl.on{color:var(--bar-on-fg);background:var(--bar-on);font-weight:650}
.stripe{display:grid;grid-template-rows:3px 2px 1.5px 1.5px}
.stripe i:nth-child(1){background:var(--sun)}.stripe i:nth-child(2){background:var(--sage)}.stripe i:nth-child(3){background:var(--moss)}.stripe i:nth-child(4){background:var(--ochre)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--bar-line);background:var(--bar-field);border-radius:8px;padding:0 9px;color:var(--muted)}
.search input{border:0;background:transparent;padding:6px 0;width:90px;outline:none;color:var(--bar-fg)}
.search input::placeholder{color:var(--bar-muted)}
.search{color:var(--bar-muted)}
/* filter bar */
.fbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-block:8px;border-bottom:1px solid var(--bar-line);background:var(--bar-bg);color:var(--bar-fg);box-shadow:0 4px 14px -10px rgb(0 0 0 / .35);position:relative;z-index:2;font-size:13px}
.fbar .lab{color:var(--bar-muted);display:flex;align-items:center;gap:5px}
.fsel{appearance:none;border:1px solid var(--bar-line);background:var(--bar-field);color:var(--bar-fg);border-radius:99px;padding:4px 24px 4px 10px;font-size:13px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat;max-width:140px;width:auto}
.fsel.on{border-color:var(--primary);background-color:var(--bar-on);color:var(--bar-on-fg);font-weight:600}
.fbar .btn.ghost,.bar .iconbtn,.fbar .iconbtn{color:var(--bar-muted)}
.fbar .btn.ghost:hover,.bar .iconbtn:hover{color:var(--bar-fg);background:var(--bar-hi)}
.brand{color:var(--bar-fg)}
.view{flex:1;min-height:0;overflow:auto;padding-block:18px 48px;background:var(--canvas)}
.view.fill{overflow:hidden;display:flex;flex-direction:column;padding-bottom:12px}

.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ph .sub{color:var(--muted);font-size:13px}
.ph .grow{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:7px 12px;border-bottom:2px solid transparent;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools .grow{flex:1}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:transparent;color:var(--primary-fg);font-weight:600}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:13px}
.iconbtn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.field-in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;min-width:0}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:5px 11px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--fg);font-weight:600}
.month{font-family:var(--f-display);font-weight:500;font-size:17px;min-width:150px}

.picon{--c:#999;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--c);color:rgb(18 24 14 / .82);flex:none}
.picon .ic{width:13px;height:13px;stroke-width:2.2}
.picon.img{background:#FFFFFF;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .12);overflow:hidden}
.picon img{width:100%;height:100%;object-fit:contain;padding:8%;display:block}
.picon img.fill{object-fit:cover;padding:0}
.symimg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px}
.symimg .prev{width:44px;height:44px;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;background:#FFFFFF}
.symimg .prev img{width:100%;height:100%;object-fit:contain;padding:8%}
.symimg .prev img.fill{object-fit:cover;padding:0}
.picon.lg{width:38px;height:38px;border-radius:10px}.picon.lg .ic{width:21px;height:21px}
.pchip{--c:#999;display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 3px;border-radius:6px;background:color-mix(in srgb,var(--c) 22%,var(--surface));max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.pchip .picon{width:18px;height:18px;border-radius:5px}.pchip .picon .ic{width:11px;height:11px}
.pill{--c:#999;display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--c) 22%,var(--surface));white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill.inh{background:transparent;border:1px dashed color-mix(in srgb,var(--c) 70%,var(--line))}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;white-space:nowrap}
.note{background:color-mix(in srgb,var(--sun) 22%,var(--surface));border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.note .grow{flex:1}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* ===== timeline ===== */
.tl-scroll{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--canvas)}
.tl{position:relative;display:grid}
.tl .corner,.tl .thead{position:sticky;top:0;z-index:4;background:var(--surface-2);border-bottom:1px solid var(--line);height:44px}
.tl .corner{left:0;z-index:6;display:flex;align-items:flex-end;padding:0 12px 6px;font-size:12px;color:var(--muted);border-right:1px solid var(--line)}
.thead{position:relative}
.mlab{position:absolute;top:5px;font-size:12px;font-weight:600;white-space:nowrap;padding-left:6px;border-left:1px solid var(--faint)}
.wlab{position:absolute;bottom:4px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);padding-left:3px;border-left:1px solid var(--line);font-variant-numeric:tabular-nums}
.wlab.mon{color:var(--fg);border-left-color:var(--faint)}
.wlab.fri{color:var(--faint)}
.corner small{display:block;font-size:10.5px;color:var(--faint);font-weight:400}
.track{background-image:repeating-linear-gradient(to right,color-mix(in srgb,var(--line) 70%,transparent) 0 1px,transparent 1px var(--wkpx,49px))}
.lname{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.lname button{display:flex;gap:8px;align-items:center;text-align:left;font-weight:600;min-width:0}
.lname button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname .lm{font-size:11.5px;color:var(--muted);padding-left:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;border-bottom:1px solid var(--line)}
.band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--c) 24%,var(--canvas))}
.band.open{background:linear-gradient(to right,color-mix(in srgb,var(--c) 24%,var(--canvas)) 0,color-mix(in srgb,var(--c) 24%,var(--canvas)) var(--solid),transparent var(--solid)),
  repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 21%,var(--canvas)) 0 6px,color-mix(in srgb,var(--c) 8%,var(--canvas)) 6px 12px)}
.band.closed{--c:#9AA391!important}
.band .cap{position:absolute;top:3px;font-size:10.5px;color:var(--muted);white-space:nowrap;font-family:var(--f-mono)}
.band.fixed{border-left:2px solid color-mix(in srgb,var(--c) 75%,var(--canvas));border-right:2px solid color-mix(in srgb,var(--c) 75%,var(--canvas))}
.wkend{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--surface-2) 55%,transparent);pointer-events:none}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:2;pointer-events:none}
.tl-today::before{content:"Today";position:absolute;top:2px;left:4px;font-size:10.5px;font-weight:600;color:var(--danger);background:var(--surface-2);padding:0 3px;border-radius:3px}
.mk{position:absolute;height:20px;display:flex;align-items:center;gap:5px;z-index:1}
.mk .dotm{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--c);background:var(--surface);flex:none}
.mk.done .dotm{background:var(--c);opacity:.5}
.mk.late .dotm{border-color:var(--danger)}
.mk .lt{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--surface) 85%,transparent);padding:0 4px;border-radius:4px}
.mk.done .lt{text-decoration:line-through;color:var(--muted)}
.mk:hover .lt{background:var(--surface);box-shadow:var(--shadow-s)}
.mk:hover .dotm{transform:scale(1.2)}
.gbar{position:absolute;height:22px;border-radius:6px;background:color-mix(in srgb,var(--c) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 55%,var(--surface));overflow:hidden;display:flex;align-items:center;font-size:12px;font-weight:500;text-align:left}
.gbar.open{border-right:0;border-radius:6px 0 0 6px;background:linear-gradient(to right,color-mix(in srgb,var(--c) 22%,var(--surface)) 70%,transparent)}
.gbar i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--c) 30%,transparent)}
.gbar span{position:relative;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend .sw{display:inline-block;width:22px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}

/* ===== project wall ===== */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.pcard{--c:#999;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;width:100%}
.pcard:hover{border-color:var(--faint);box-shadow:var(--shadow-s)}
.pcard .top{display:flex;gap:10px;align-items:center;padding:14px 14px 10px;background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.pcard .top b{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.pcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pcard .stats div{display:flex;flex-direction:column}
.pcard .stats b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.pcard .stats span{font-size:11.5px;color:var(--muted)}
.pcard .next{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .next b{color:var(--fg);font-weight:500}
.pbar{position:relative;height:8px;border-radius:99px;background:var(--surface-2)}
.pbar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c)}
.pbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.55;text-decoration:none}
.pmeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.spark{width:100%;height:34px;display:block}
.newcard{border:1.5px dashed var(--line);border-radius:14px;min-height:150px;display:grid;place-items:center;color:var(--muted);gap:6px}
.newcard:hover{border-color:var(--accent);color:var(--fg)}
.sech{font-family:var(--f-display);font-weight:500;font-size:16px;margin:24px 0 10px;color:var(--muted)}

/* project page */
.phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.phead h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0}
.phead .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
/* notebook */
.nb{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.composer textarea{border:0;outline:none;background:transparent;resize:vertical;min-height:80px;width:100%}
.composer .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.composer .row .grow{flex:1}
.entries{display:flex;flex-direction:column;gap:0;position:relative}
.entry{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.entry.hl{background:color-mix(in srgb,var(--sun) 16%,transparent);border-radius:8px}
.entry .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.entry .when b{display:block;font-family:var(--f-display);font-size:20px;color:var(--fg);font-weight:700;line-height:1}
.entry .eh{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.entry .eh .grow{flex:1}
.nline{display:flex;gap:8px;align-items:flex-start;padding:2px 6px;margin:0 -6px;border-radius:6px;max-width:72ch}
.nline:hover{background:var(--surface-2)}
.nline .tx{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.nline .mkt{opacity:0;font-size:12px;color:var(--accent);display:inline-flex;align-items:center;gap:3px;white-space:nowrap;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface)}
.nline:hover .mkt,.nline .mkt:focus-visible{opacity:1}
.nline .linked{font-size:12px;color:var(--ok);display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.nline .linked.done{color:var(--muted)}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.side-card h3{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mini{display:flex;gap:8px;align-items:center;text-align:left;width:100%}
.mini .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* list */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.tl2{border-collapse:collapse;width:100%;min-width:820px}
.tl2 th{font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tl2 td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tl2 tr.row{cursor:pointer}
.tl2 tr.row:hover td{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}

.criteria ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.criteria li{display:flex;gap:8px;align-items:baseline}.criteria li .tonedot{flex:none;min-width:118px;font-weight:600}
.statusbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.statusbar b{color:var(--fg);font-variant-numeric:tabular-nums}
.rvbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.rvbar .presets{display:flex;flex-wrap:wrap;gap:4px}
.chipbtn{padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.chipbtn:hover{color:var(--fg)}
.chipbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:600}
.rvdates{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.panel h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:17px;display:flex;gap:8px;align-items:baseline}
.panel h2 span{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.rrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rrow .t{flex:1;min-width:180px;text-align:left}
.rrow .acts{display:flex;gap:4px;flex-wrap:wrap}
.hbar{display:grid;grid-template-columns:minmax(0,170px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbar .b{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--c)}
.big{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.bigrow{display:flex;gap:26px;flex-wrap:wrap}
.bigrow div span{display:block;font-size:12px;color:var(--muted);margin-top:4px}

/* ===== insights ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.builder{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
.builder .ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.builder label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ccard h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:16px;display:flex;gap:8px;align-items:center}
.ccard h3 span{flex:1;min-width:0}
.ccard .sub2{font-size:12px;color:var(--muted);margin-top:-6px}
.canv{position:relative;height:220px}
.ltab{width:100%;border-collapse:collapse;font-size:13px}
.ltab td{padding:3px 0;border-top:1px solid var(--line)}
.ltab td:nth-child(2),.ltab td:nth-child(3){text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;width:64px}
.ltab .sw2{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;background:var(--c)}
.preview{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;margin-top:14px;align-items:start}
/* strategy */
.intro{max-width:68ch;color:var(--muted);margin:0 0 16px}
.goals{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1180px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);overflow:hidden}
.gmain{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.gsubs{padding:18px 18px 18px 22px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative;border-left:0;background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.gsubs::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--tone,var(--faint))}
.glevel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.gsect{margin-bottom:6px;display:flex;gap:6px;align-items:baseline}
.gtasks{display:flex;flex-direction:column;gap:2px}
.gtasks .mini{padding:4px 6px;border-radius:6px}.gtasks .mini:hover{background:var(--surface-2)}
.mini.mdone .t{text-decoration:line-through;color:var(--muted)}
.tickmini{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;font-style:normal}
.mdone .tickmini{background:var(--ok);border-color:var(--ok);color:var(--surface)}.tickmini .ic{width:10px;height:10px;stroke-width:3}
.child{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tone,var(--line));border-radius:10px;padding:10px 12px}
.cmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (max-width:640px){.goal{grid-template-columns:minmax(0,1fr)}.gsubs{padding-left:18px;padding-top:22px}.gsubs::before{left:14px;right:14px;top:0;bottom:auto;width:auto;height:3px}}
.goal .gh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.goal h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:18px;text-wrap:balance}
.goal h3 button{text-align:left}
.bar2{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--c,var(--sage));border-radius:99px}
.prog{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:12px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.children{display:flex;flex-direction:column;gap:10px}
.child{display:flex;flex-direction:column;gap:6px}
.child .ct{display:flex;gap:8px;align-items:center}
.child .ct button{text-align:left;font-weight:500;flex:1;min-width:0}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}

@media (max-width:860px){
  .search input{width:100px}
  .nb,.rv,.preview,.sbody{grid-template-columns:minmax(0,1fr)}

}

function taskMatch(t){
  const f = UI.filt;
  if(!seesTask(t)) return false;
  if(reviewSelf() && t.assigneeId!==viewer()?.id) return false;
  if(f.person && !involved(t, f.person)) return false;
  if(f.team){ const tm = team(f.team); const p = proj(t.projectId); if(!tm || !(tm.memberIds.some(m => involved(t, m)) || (p && (p.teamIds||[]).includes(f.team)))) return false; }
  if(f.project && (f.project==='none' ? !!t.projectId : t.projectId!==f.project)) return false;
  for(const d of dims()){ if(f[d.id] && effDim(t, d.id)!==f[d.id]) return false; }
  const q = UI.q.trim().toLowerCase();
  if(q && !t.title.toLowerCase().includes(q)) return false;
  return true;
}
function projMatch(p){
  const f = UI.filt;
  if(!seesProject(p) && !S.tasks.some(t => t.projectId===p.id && seesTask(t))) return false;
  if(f.project && f.project!==p.id) return false;
  if(f.person && !(projPeople(p).includes(f.person) || S.tasks.some(t => t.projectId===p.id && involved(t, f.person)))) return false;
  if(f.team && !((p.teamIds||[]).includes(f.team) || projPeople(p).some(x => inTeam(f.team, x)))) return false;
  if(f.person || f.team){ const others = dims().filter(d => f[d.id]); if(!others.length && !UI.q.trim()) return true; }
  const active = dims().filter(d => f[d.id]);
  if(!active.length && !UI.q.trim()) return true;
  if(!UI.q.trim() && active.every(d => p.dims?.[d.id]===f[d.id])) return true;
  return S.tasks.some(t => t.projectId===p.id && taskMatch(t));
}

function fmtDue(s, done){
  if(!s) return '';
  const d = diffDays(s), dt = parse(s), t = parse(todayISO());
  let txt;
  if(d===0) txt='Today'; else if(d===1) txt='Tomorrow'; else if(d===-1) txt='Yesterday';
  else if(d>1 && d<7) txt = dt.toLocaleDateString('en-GB',{weekday:'long'});
  else txt = dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',...(dt.getFullYear()!==t.getFullYear()?{year:'numeric'}:{})});
  const cls = done ? 'muted' : d<0 ? 'overdue' : d<=1 ? 'soon' : '';
  return `<span class="${cls}">${txt}</span>`;
}

/* ---------- task helpers ---------- */
function setDone(t, done){ t.done = done; t.status = done ? 'done' : (t.status==='done' ? 'todo' : t.status); t.completedAt = done ? todayISO() : null; }
function setStatus(t, st){ t.status = st; t.done = st==='done'; t.completedAt = t.done ? (t.completedAt || todayISO()) : null; }
function newTask(extra={}){
  const t = {id:'t_'+uid(),title:'',projectId:(UI.page==='project'?UI.projectId:(UI.filt.project && UI.filt.project!=='none' ? UI.filt.project : null)),
    due:null,status:'todo',done:false,completedAt:null,createdAt:todayISO(),notes:'',hours:null,custom:{},subtasks:[],source:null,
    createdBy:viewer()?.id||null, assigneeId:UI.filt.person||viewer()?.id||null, collaboratorIds:[], ...extra};
  S.tasks.push(t); return t;
}
const byDue = (a,b) => (a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : 0;
function lastActivity(p){
  let last = null;
  S.tasks.filter(t=>t.projectId===p.id).forEach(t => { [t.completedAt, t.createdAt].forEach(d => { if(d && d<=todayISO() && (!last || d>last)) last = d; }); });
  S.notes.filter(n=>n.projectId===p.id).forEach(n => { if(!last || n.date>last) last = n.date; });
  return last;
}
function elapsed(p){ if(!p.start || !p.end) return 0; const s = parse(p.start), e = parse(p.end), n = parse(todayISO()); return Math.max(0, Math.min(1, (n-s)/(e-s))); }
function health(p){
  const ts = S.tasks.filter(t=>t.projectId===p.id), open = ts.filter(t=>!t.done);
  const overdue = open.filter(t=>t.due && diffDays(t.due)<0).length;
  if(p.status==='closed') return {label:'Closed',color:'#7C8577',tone:'idle'};
  if(p.status==='paused') return {label:'Paused',color:'#B89A6A',tone:'idle'};
  if(p.kind==='fixed' && p.end){
    if(diffDays(p.end)<0 && open.length) return {label:'Past end date',color:'#C8634A',tone:'bad'};
    const pct = ts.length ? ts.filter(t=>t.done).length/ts.length : 0;
    if(overdue || elapsed(p)-pct > .25) return {label:'At risk',color:'#E39A3E',tone:'warn'};
    return {label:'On track',color:'#6B9160',tone:'good'};
  }
  const last = lastActivity(p);
  if(overdue) return {label:`${overdue} overdue`,color:'#E39A3E',tone:'warn'};
  if(!last || diffDays(last) < -30) return {label:'Quiet',color:'#8A6440',tone:'quiet'};
  return {label:'Active',color:'#6B9160',tone:'good'};
}
function weeklyDone(filterFn, n=12){
  const start = addDays(monday(new Date()), -(n-1)*7), out = [];
  for(let i=0;i<n;i++){ const s = addDays(start, i*7), e = addDays(s, 7);
    out.push({label:s.toLocaleDateString('en-GB',{day:'numeric',month:'short'}), value:S.tasks.filter(t=>filterFn(t) && t.completedAt && parse(t.completedAt)>=s && parse(t.completedAt)<e).length}); }
  return out;
}
function sparkline(vals, color){
  const max = Math.max(1, ...vals), w = 120, h = 34, step = w/(vals.length-1);
  const pts = vals.map((v,i)=>`${(i*step).toFixed(1)},${(h-3-(v/max)*(h-8)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="0,${h} ${pts.join(' ')} ${w},${h}" fill="${color}" fill-opacity=".18"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${w}" cy="${pts[pts.length-1].split(',')[1]}" r="2.6" fill="${color}"/></svg>`;
}
const goalRange = g => `${fmtD(g.start,{month:'short',year:'numeric'})} – ${g.end ? fmtD(g.end,{month:'short',year:'numeric'}) : 'open-ended'}`;
const goalYears = g => { const a = +g.start.slice(0,4), b = g.end ? +g.end.slice(0,4) : Math.max(a, new Date().getFullYear()+1); const out = []; for(let y=a; y<=b && out.length<8; y++) out.push(String(y)); return out; };
function periodRange(p){
  if(!p) return null; const m = p.match(/(\d{4})/); if(!m) return null; const y = +m[1];
  if(/H1/i.test(p)) return [`${y}-01-01`,`${y}-06-30`];
  if(/H2/i.test(p)) return [`${y}-07-01`,`${y}-12-31`];
  const q = p.match(/Q([1-4])/i); if(q){ const k=+q[1]; return [`${y}-${pad((k-1)*3+1)}-01`, iso(new Date(y, k*3, 0))]; }
  return [`${y}-01-01`,`${y}-12-31`];
}

/* ===== timeline ===== */
const ZOOM = {weeks:{ppd:30,back:21,fwd:100,label:'Weeks'},months:{ppd:7,back:56,fwd:330,label:'Months'},quarters:{ppd:2.2,back:120,fwd:640,label:'Quarters'}};
let TL = null;
function timelineHTML(){
  const z = ZOOM[UI.zoom], ppd = z.ppd;
  const start = monday(addDays(new Date(), -z.back)), end = addDays(start, z.back + z.fwd);
  const days = Math.round((end - start)/864e5), W = Math.round(days*ppd);
  const x = s => (parse(s) - start)/864e5*ppd;
  const startISO = iso(start), endISO = iso(end);
  TL = {x, W};
  // header
  let head = '';
  for(let d = new Date(start.getFullYear(), start.getMonth(), 1); d <= end; d = new Date(d.getFullYear(), d.getMonth()+1, 1)){
    const px = x(iso(d)); if(px < -40) continue;
    const q = UI.zoom==='quarters';
    if(!q || d.getMonth()%3===0) head += `<span class="mlab" style="left:${Math.max(0,px)}px;height:${q?38:20}px">${d.toLocaleDateString('en-GB', q?{month:'short',year:'numeric'}:{month:'long',...(d.getMonth()===0||px<5?{year:'numeric'}:{})})}${q?` · Q${d.getMonth()/3+1}`:''}</span>`;
    if(q) head += `<span class="wlab" style="left:${px}px">${d.toLocaleDateString('en-GB',{month:'short'})}</span>`;
  }
  let shading = '';
  if(UI.zoom!=='quarters') for(let d = new Date(start); d < end; d = addDays(d,7)){
    const fri = addDays(d,4), wk = UI.zoom==='weeks';
    head += `<span class="wlab mon" style="left:${x(iso(d))}px">${wk?'Mon ':''}${d.getDate()}</span><span class="wlab fri" style="left:${x(iso(fri))}px">${wk?'Fri ':''}${fri.getDate()}</span>`;
    if(wk) shading += `<i class="wkend" style="left:${x(iso(addDays(d,5)))}px;width:${2*ppd}px"></i>`;
  }
  const lanes = [];
  // goals lane
  const goals = S.goals.filter(g => g.start && !g.parentId && seesGoal(g)).map(g => ({g, r:[g.start, g.end || endISO]})).filter(o => o.r[1]>=startISO && o.r[0]<=endISO);
  if(goals.length && !UI.filt.project){
    const rows = []; const items = goals.map(({g,r}) => { const l = Math.max(0,x(r[0])), w = Math.min(W, x(r[1])+ppd) - l;
      let row = rows.findIndex(e => e <= l); if(row<0){ row = rows.length; rows.push(0); } rows[row] = l + w + 4; return {g,l,w,row}; });
    const h = 12 + rows.length*28;
    lanes.push(`<div class="lname" style="height:${h}px"><button data-act="go" data-page="strategy"><span class="picon" style="--c:var(--sun)">${icon('target')}</span><span>Goals</span></button><span class="lm">${goals.length} in view</span></div>
      <div class="track" style="height:${h}px;width:${W}px">${shading}${items.map(({g,l,w,row}) => { const st = GSTAT.find(s=>s.id===g.status)||GSTAT[0], pg = goalProgress(g);
        return `<button class="gbar ${g.end?'':'open'}" style="--c:${st.color};left:${l}px;width:${w}px;top:${8+row*28}px" data-act="editGoal" data-id="${g.id}" title="${esc(g.title)} · ${goalRange(g)} · ${pg}%"><i style="width:${pg}%"></i><span style="padding-left:${Math.max(8, x(todayISO()) - 150 - l)}px">${esc(g.title)} · ${pg}%</span></button>`; }).join('')}</div>`);
  }
  // project lanes
  const order = p => p.status==='closed' ? 3 : p.status==='paused' ? 2 : p.kind==='fixed' ? 0 : 1;
  const ps = S.projects.filter(p => projMatch(p) && !(p.status==='closed' && p.end && p.end < startISO)).sort((a,b)=>order(a)-order(b));
  const laneFor = (p, ts) => {
    const color = p ? p.color : NONE;
    const dated = ts.filter(t => t.due && t.due>=startISO && t.due<=endISO && (UI.showDone || !t.done)).sort(byDue);
    const undated = ts.filter(t => !t.due && !t.done).length;
    const rows = [];
    const marks = dated.map(t => {
      const l = x(t.due) + ppd/2 - 6;
      const lw = UI.zoom==='weeks' ? Math.min(170, 7*t.title.length + 26) : UI.zoom==='months' ? Math.min(150, 6.6*t.title.length + 24) : 14;
      let row = rows.findIndex(e => e <= l); if(row<0){ row = rows.length; rows.push(0); } rows[row] = l + lw + 6;
      return {t, l, lw, row};
    });
    const h = Math.max(54, 14 + Math.max(1,rows.length)*24 + 8);
    let band = '';
    if(p){
      const s = p.start && p.start>startISO ? x(p.start) : 0;
      if(p.kind==='fixed' && p.end){
        const e = Math.min(W, x(p.end)+ppd);
        if(e > s) band = `<div class="band fixed ${p.status==='closed'?'closed':''}" style="--c:${p.color};left:${s}px;width:${e-s}px">${p.end<=endISO?`<span class="cap" style="right:4px">ends ${fmtD(p.end)}</span>`:''}</div>`;
      } else {
        const solid = Math.max(0, Math.min(W, x(todayISO())) - s);
        band = `<div class="band open ${p.status!=='active'?'closed':''}" style="--c:${p.color};left:${s}px;width:${W-s}px;--solid:${solid}px"><span class="cap" style="left:${solid+8}px">${p.status==='paused'?'paused':'ongoing, no end date'}</span></div>`;
      }
    }
    const today = todayISO();
    const mk = marks.map(({t,l,lw,row}) => `<button class="mk ${t.done?'done':''} ${!t.done&&t.due<today?'late':''}" style="--c:${color};left:${l}px;top:${12+row*24}px;max-width:${lw}px" data-act="openTask" data-id="${t.id}" title="${esc(t.title)} · ${fmtD(t.due,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}${t.done?' · done':''}">
      <span class="dotm"></span>${UI.zoom!=='quarters'?`<span class="lt">${esc(t.title)||'Untitled task'}</span>`:''}</button>`).join('');
    const open = ts.filter(t=>!t.done).length;
    const meta = p ? `${p.kind==='fixed'&&p.start&&p.end?`${fmtD(p.start)} – ${fmtD(p.end,{day:'numeric',month:'short',year:'2-digit'})}`:p.status==='active'?'Ongoing':p.status==='paused'?'Paused':'Closed'} · ${open} open${undated?` · ${undated} undated`:''}` : `${open} open${undated?` · ${undated} undated`:''}`;
    return `<div class="lname" style="height:${h}px">${p?`<button data-act="go" data-page="project" data-id="${p.id}"><span class="picon ${p.img?'img':''}" style="--c:${p.color}">${psym(p)}</span><span>${esc(p.name)}</span></button>`:`<button data-act="setFilt" data-k="project" data-v="none"><span class="picon" style="--c:${NONE}">${icon('folder')}</span><span>No project</span></button>`}<span class="lm">${meta}</span></div>
      <div class="track" style="height:${h}px;width:${W}px">${shading}${band}${mk}</div>`;
  };
  ps.forEach(p => lanes.push(laneFor(p, S.tasks.filter(t => t.projectId===p.id && taskMatch(t)))));
  const loose = S.tasks.filter(t => !proj(t.projectId) && taskMatch(t));
  if(loose.length && (!UI.filt.project || UI.filt.project==='none')) lanes.push(laneFor(null, loose));
  const todayX = 200 + x(todayISO()) + ppd/2;
  return `<div class="ph"><h1>Timeline</h1><span class="sub">Every project as a lane. Solid bands are fixed-term projects; hatched bands run on with no end date.</span><span class="grow"></span>

/* ===== project wall ===== */
function pcardHTML(p){
  const ts = S.tasks.filter(t=>t.projectId===p.id), open = ts.filter(t=>!t.done);
  const overdue = open.filter(t=>t.due && diffDays(t.due)<0).length;
  const h = health(p), time = ts.reduce((s,t)=>s+(+t.hours||0),0);
  const next = open.filter(t=>t.due).sort(byDue)[0];
  const last = lastActivity(p);
  let mid;
  if(p.kind==='fixed'){
    const pct = ts.length ? Math.round(ts.filter(t=>t.done).length/ts.length*100) : 0, el = Math.round(elapsed(p)*100);
    const left = p.end ? diffDays(p.end) : null;
    mid = `<div class="pbar" style="--c:${p.color}" title="${pct}% of tasks done; ${el}% of the time has passed"><i style="width:${pct}%"></i>${p.start&&p.end?`<u style="left:${el}%"></u>`:''}</div>
      <div class="pmeta"><span>${pct}% of tasks done</span><span>${p.end ? (left>=0 ? `${left} days left · ends ${fmtD(p.end)}` : `ended ${fmtD(p.end,{day:'numeric',month:'short',year:'numeric'})}`) : 'No end date set'}</span></div>`;
  } else {
    const wk = weeklyDone(t=>t.projectId===p.id).map(d=>d.value);
    mid = `${sparkline(wk, p.color)}<div class="pmeta"><span>Completed per week, last 12 weeks</span><span>${p.start?`since ${fmtD(p.start,{month:'short',year:'numeric'})}`:''}</span></div>`;
  }
  return `<button class="pcard tone-${h.tone}" style="--c:${p.color}" data-act="go" data-page="project" data-id="${p.id}">
    <div class="top"><span class="picon lg ${p.img?'img':''}" style="--c:${p.color}">${psym(p)}</span><b>${esc(p.name)}</b>${kindBadge(p)}</div>
    <div class="ppl-row"><span class="who">${av(person(p.ownerId),'sm')}<span>${esc(firstName(person(p.ownerId)))||'No owner'}</span><span class="muted">owner</span></span>${avStack(projPeople(p).filter(x=>x!==p.ownerId).map(person).filter(Boolean),5)}</div>
    <div class="body">
      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill" style="--c:${h.color}">${h.label}</span>${dims().map(d=>optPill(d, p.dims?.[d.id])).join('')}</div>
      ${mid}
      <div class="stats"><div><b>${open.length}</b><span>open</span></div><div><b style="${overdue?'color:var(--danger)':''}">${overdue}</b><span>overdue</span></div><div><b>${hrs(time)}</b><span>hours logged</span></div></div>
      <div class="next">${next ? `Next: <b>${esc(next.title)}</b> · ${fmtDue(next.due)}` : 'No upcoming dated tasks'}</div>
      <div class="next">${last ? `Last activity ${fmtDue(last,true)}` : 'No activity yet'}</div>
    </div></button>`;
}

function listHTML(ts, p){

function calendarHTML(ts){
  const ws = S.settings.weekStart, first = UI.month, last = new Date(first.getFullYear(), first.getMonth()+1, 0);
  const start = new Date(first); start.setDate(1 - ((first.getDay() - ws + 7) % 7));
  const end = new Date(last); end.setDate(last.getDate() + ((ws + 6 - last.getDay() + 7) % 7));
  const names = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = ''; for(let i=0;i<7;i++) html += `<div class="dow">${names[(i+ws)%7]}</div>`;
  const today = todayISO();
  for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const k = iso(d), items = ts.filter(t => t.due===k && (UI.showDone || !t.done));

  }
  return `<div class="cal-wrap"><div class="cal">${html}</div></div>`;
}

/* ===== weekly review ===== */
const RV_PRESETS = [['this_week','This week'],['last_week','Last week'],['last_7','Last 7 days'],['this_month','This month'],['last_month','Last month'],['last_30','Last 30 days'],['this_q','This quarter'],['last_q','Last quarter'],['this_year','This year'],['last_year','Last year']];
function presetRange(k){
  const t = parse(todayISO()), y = t.getFullYear(), m = t.getMonth(), q = Math.floor(m/3);
  const R = {this_week:()=>[monday(t), addDays(monday(t),6)], last_week:()=>[addDays(monday(t),-7), addDays(monday(t),-1)],
    last_7:()=>[addDays(t,-6), t], this_month:()=>[new Date(y,m,1), new Date(y,m+1,0)], last_month:()=>[new Date(y,m-1,1), new Date(y,m,0)],
    last_30:()=>[addDays(t,-29), t], this_q:()=>[new Date(y,q*3,1), new Date(y,q*3+3,0)], last_q:()=>[new Date(y,q*3-3,1), new Date(y,q*3,0)],
    this_year:()=>[new Date(y,0,1), new Date(y,11,31)], last_year:()=>[new Date(y-1,0,1), new Date(y-1,11,31)]};
  return (R[k]||R.this_week)().map(iso);
}
function rvRange(){ return UI.rv.preset==='custom' ? [UI.rv.from, UI.rv.to] : presetRange(UI.rv.preset); }
const spanDays = (a,b) => Math.round((parse(b)-parse(a))/864e5) + 1;
function fmtRange(a,b){ const A = parse(a), B = parse(b), sy = A.getFullYear()===B.getFullYear();
  return `${A.toLocaleDateString('en-GB',{day:'numeric',month:'short',...(sy?{}:{year:'numeric'})})} – ${B.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`; }
function reviewHTML(){

  const done = S.tasks.filter(t => taskMatch(t) && t.done && inR(t.completedAt)).sort((x,y)=>x.completedAt<y.completedAt?-1:1);
  const hoursDone = done.reduce((s,t)=>s+(+t.hours||0),0);
  const cutoff = b < today ? b : iso(addDays(parse(today),-1));
  const slipped = S.tasks.filter(t => taskMatch(t) && !t.done && t.due && t.due <= cutoff).sort(byDue);
  const upStart = b >= today ? iso(addDays(parse(b),1)) : today;
  const upLen = Math.max(7, Math.min(31, spanDays(a,b)));
  const upEnd = iso(addDays(parse(upStart), upLen-1));
  const upcoming = S.tasks.filter(t => taskMatch(t) && !t.done && t.due && t.due>=upStart && t.due<=upEnd).sort(byDue);
  const touchesNow = b >= iso(addDays(parse(today),-1));
  const incUp = UI.rv.inc==null ? touchesNow : UI.rv.inc;
  const active = S.projects.filter(p => p.status==='active' && projMatch(p));
  const activity = p => S.tasks.some(t=>t.projectId===p.id && (inR(t.completedAt)||inR(t.createdAt))) || S.notes.some(n=>n.projectId===p.id && inR(n.date));
  const quiet = active.filter(p => !activity(p));
  const notesR = S.notes.filter(n => inR(n.date) && (!UI.filt.project || n.projectId===UI.filt.project));
  const byProj = new Map(); done.forEach(t => { const p = proj(t.projectId), k = p?p.id:'_'; if(!byProj.has(k)) byProj.set(k,{label:p?p.name:'No project',color:p?p.color:NONE,h:0,n:0}); const o = byProj.get(k); o.h += +t.hours||0; o.n++; });
  const projRows = [...byProj.values()].sort((x,y)=>y.h-x.h||y.n-x.n);
  const byGoal = new Map(); done.forEach(t => { const gs = taskTopGoals(t); (gs.length?gs:['_']).forEach(k => { const g = S.goals.find(x=>x.id===k);
    if(!byGoal.has(k)) byGoal.set(k,{label:g?g.title:'Not linked to a goal',color:g?(GSTAT.find(x=>x.id===g.status)||GSTAT[0]).color:NONE,h:0,n:0}); const o = byGoal.get(k); o.h += +t.hours||0; o.n++; }); });
  const goalRows = [...byGoal.entries()].sort((x,y)=>(x[0]==='_')-(y[0]==='_')||y[1].h-x[1].h||y[1].n-x[1].n).map(e=>e[1]);
  const bdFields = UI.rv.dims.map(fld).filter(Boolean);
  const byDim = new Map(); if(bdFields.length) done.forEach(t => { const parts = bdFields.map(f => { const o = f.options.find(o=>o.id===effDim(t,f.id)); return o; });

  const dimRows = [...byDim.values()].sort((x,y)=>y.h-x.h||y.n-x.n);
  const useH = hoursDone > 0, metric = r => useH ? r.h : r.n;
  const barRows = (rows, total) => { const max = Math.max(1e-9, ...rows.map(metric)); return rows.map(r=>`<div class="hbar"><span title="${esc(r.label)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span><span class="b"><i style="width:${metric(r)/max*100}%;--c:${r.color}"></i></span><span class="mono">${useH?`${hrs(r.h)} h`:`${r.n} task${r.n>1?'s':''}`}${total?` · ${Math.round(metric(r)/total*100)}%`:''}</span></div>`).join(''); };
  const range = fmtRange(a,b);

  const summary = [`${presetName}: ${range}`, `${done.length} task${done.length===1?'':'s'} completed, ${hrs(hoursDone)} h logged.`,
    ...(goalRows.length?['','By goal:', ...goalRows.map(r=>`- ${r.label}: ${r.n} task${r.n>1?'s':''}${r.h?`, ${hrs(r.h)} h`:''}`)]:[]),
    ...(projRows.length?['','By project:', ...projRows.map(r=>`- ${r.label}: ${r.n} task${r.n>1?'s':''}${r.h?`, ${hrs(r.h)} h`:''}`)]:[]),
    ...(dimRows.length?['',`By ${bdFields.map(f=>f.name.toLowerCase()).join(' × ')}:`, ...dimRows.map(r=>`- ${r.label}: ${r.n} task${r.n>1?'s':''}${r.h?`, ${hrs(r.h)} h`:''}`)]:[]),
    ...(done.length?['','Completed:', ...done.map(t=>`- ${t.title}${pn(t)}`)]:[]),
    ...(slipped.length?['',`Open and overdue (${slipped.length}):`, ...slipped.map(t=>`- ${t.title}${pn(t)}, due ${fmtD(t.due,{day:'numeric',month:'short',year:'numeric'})}`)]:[]),
    ...(incUp && upcoming.length?['',`Coming up, ${fmtRange(upStart,upEnd)}:`, ...upcoming.map(t=>`- ${t.title}${pn(t)}, ${fmtD(t.due,{weekday:'short',day:'numeric',month:'short'})}`)]:[])].join('\n');

  const slipActs = t => `<button class="btn sm" data-act="rvDone" data-id="${t.id}">${icon('check')}Done</button><button class="btn sm" data-act="rvMove" data-id="${t.id}" data-to="nextmon">Next Monday</button><button class="btn sm" data-act="rvMove" data-id="${t.id}" data-to="plus7">+1 week</button><button class="btn sm ghost" data-act="rvMove" data-id="${t.id}" data-to="none">No date</button>`;
  return `<div class="ph"><h1>Review</h1><span class="sub">${presetName} · ${range}</span></div>
    <div class="rvbar">
      <button class="iconbtn" data-act="rvShift" data-d="-1" aria-label="Previous period">${icon('left')}</button>
      <div class="presets">${RV_PRESETS.map(([k,l])=>`<button class="chipbtn ${UI.rv.preset===k?'on':''}" data-act="rvPreset" data-k="${k}">${l}</button>`).join('')}</div>
      <button class="iconbtn" data-act="rvShift" data-d="1" aria-label="Next period">${icon('right')}</button>
      <span class="rvdates ${UI.rv.preset==='custom'?'':''}"><label for="rv-from">From</label><input id="rv-from" type="date" class="field-in" value="${a}" data-rv="from"><label for="rv-to">to</label><input id="rv-to" type="date" class="field-in" value="${b}" data-rv="to"></span>
    </div>
    <div class="rv"><div class="colm">
      <div class="panel"><div class="bigrow">
        <div><div class="big tone-good">${done.length}</div><span>tasks completed</span></div>
        <div><div class="big">${hrs(hoursDone)}</div><span>hours logged on them</span></div>
        <div><div class="big ${slipped.length?'tone-bad':''}">${slipped.length}</div><span>open and overdue</span></div>

      <div class="panel"><h2>Goals</h2>${S.goals.filter(g=>!g.parentId && seesGoal(g)).map(g=>{ const st = GSTAT.find(s=>s.id===g.status)||GSTAT[0], pg = goalProgress(g); return `<div class="hbar"><span class="tonedot tone-${st.tone}" style="overflow:hidden;white-space:nowrap" title="${esc(g.title)} · ${st.label}">${esc(g.title)}</span><span class="b"><i style="width:${pg}%;--c:${st.color}"></i></span><span class="mono">${pg}%</span></div>`; }).join('') || '<span class="muted">No goals yet.</span>'}</div>

  return {open:open.length, overdue:open.filter(t=>t.due && diffDays(t.due)<0).length, done30:d30.length, h30:d30.reduce((a,t)=>a+(+t.hours||0),0)};
}

function groupOptions(){ return [['project','Project'],['status','Status'],['month','Due month'], ...S.fields.filter(f=>f.type==='select').map(f=>[f.id,f.name])]; }
const groupName = by => (groupOptions().find(o=>o[0]===by)||[,by])[1];
function aggregate(cfg){
  let ts = S.tasks.filter(t => taskMatch(t) && (cfg.scope==='all' || t.projectId===cfg.scope));
  if(cfg.filter==='open') ts = ts.filter(t=>!t.done); else if(cfg.filter==='done') ts = ts.filter(t=>t.done);
  const val = t => cfg.measure==='count' ? 1 : cfg.measure==='hours' ? (+t.hours||0) : (parseFloat(t.custom?.[cfg.measure])||0);
  const m = new Map();
  const add = (k,label,color,t,order) => { if(!m.has(k)) m.set(k,{label,color,value:0,order}); m.get(k).value += val(t); };
  ts.forEach(t => {
    if(cfg.by==='project'){ const p = proj(t.projectId); add(p?p.id:'_',p?p.name:'No project',p?p.color:NONE,t); }
    else if(cfg.by==='status'){ const s = STATUSES.find(x=>x.id===t.status); add(s.id,s.label,s.color,t); }
    else if(cfg.by==='month'){ if(!t.due) add('_','No date',NONE,t,'9999'); else { const k=t.due.slice(0,7); add(k,parse(k+'-01').toLocaleDateString('en-GB',{month:'short',year:'2-digit'}),'#6B9160',t,k); } }
    else { const f = fld(cfg.by); if(!f) return; const v = f.dim ? effDim(t, f.id) : t.custom?.[f.id]; const o = f.options.find(o=>o.id===v); add(o?o.id:'_',o?o.label:'Not set',o?o.color:NONE,t); }
  });
  const out = [...m.values()].filter(d=>d.value>0);
  out.sort(cfg.by==='month' ? (a,b)=>a.order<b.order?-1:1 : (a,b)=>b.value-a.value);
  return out;
}
function chartTitle(c){
  const fl = ({all:'',open:'open ',done:'completed '})[c.filter];
  const what = c.measure==='count' ? `${fl?fl[0].toUpperCase()+fl.slice(1):'T'}${fl?'tasks':'asks'}` : c.measure==='hours' ? `Hours logged${fl?` on ${fl}tasks`:''}` : `${fld(c.measure)?.name||'Value'}${fl?` (${fl.trim()} tasks)`:''}`;
  return `${what} by ${groupName(c.by).toLowerCase()}`;
}
function legendTable(data, unit){
  const tot = data.reduce((s,d)=>s+d.value,0) || 1;
  return `<table class="ltab"><tbody>${data.map(d=>`<tr><td><span class="sw2" style="--c:${d.color}"></span>${esc(d.label)}</td><td>${hrs(d.value)}${unit}</td><td>${Math.round(d.value/tot*100)}%</td></tr>`).join('')}</tbody></table>`;
}
function chartCard(c, idx){
  const data = aggregate(c);
  const scope = c.scope==='all' ? 'All projects' : (proj(c.scope)?.name || 'Deleted project');
  return `<div class="ccard"><h3><span>${chartTitle(c)}</span>${idx!=null?`<button class="iconbtn" data-act="rmChart" data-i="${idx}" aria-label="Remove chart">${icon('x')}</button>`:''}</h3>

    ${data.length ? `<div class="canv"><canvas data-chart="${idx==null?'preview':idx}" aria-label="${chartTitle(c)}"></canvas></div>${legendTable(data, c.measure==='hours'?' h':'')}` : '<div class="empty">No matching tasks.</div>'}</div>`;
}

/* ===== strategy ===== */
const goalTasks = g => S.tasks.filter(t => t.goalId===g.id || (t.projectId && g.projectIds.includes(t.projectId)));
const topGoalId = id => { const g = S.goals.find(x=>x.id===id); return g ? (g.parentId || g.id) : null; };
function taskTopGoals(t){ const out = new Set(); if(t.goalId){ const k = topGoalId(t.goalId); if(k) out.add(k); }
  if(t.projectId) S.goals.forEach(g => { if(g.projectIds.includes(t.projectId)) out.add(g.parentId || g.id); }); return [...out]; }
function goalProgress(g){
  const kids = S.goals.filter(x=>x.parentId===g.id), ts = goalTasks(g);
  if(g.status==='achieved') return 100;
  if(ts.length) return Math.round(ts.filter(t=>t.done).length/ts.length*100);
  if(kids.length) return Math.round(kids.reduce((s,k)=>s+goalProgress(k),0)/kids.length);
  return +g.manual||0;
}
function progSource(g){
  if(g.status==='achieved') return 'marked achieved';
  const ts = goalTasks(g); if(ts.length){ const d = ts.filter(t=>t.goalId===g.id).length;
    return d===ts.length ? `from ${d} directly linked task${d>1?'s':''}` : d ? `from linked project tasks and ${d} direct task${d>1?'s':''}` : 'from linked project tasks'; }
  if(S.goals.some(x=>x.parentId===g.id)) return 'average of sub-goals';
  return 'set manually';
}

        ${subs.length?`<span style="margin-left:10px"><b>${subs.length}</b> sub-goal${subs.length===1?'':'s'}:</span>${tally(subs).map(({st,n})=>`<span class="tonedot tone-${st.tone}"><b>${n}</b> ${st.label.toLowerCase()}</span>`).join('')}`:''}</div>`; })()}
    ${tops.length ? `<div class="goals">${tops.map(g => { const st = gs(g.status), pg = goalProgress(g), kids = S.goals.filter(x=>x.parentId===g.id && seesGoal(x));

            <div class="bar2" style="--c:${ks.color};height:5px"><i style="width:${kp}%"></i></div>
            <div class="cmeta"><span class="tag">${goalRange(k)}</span>${k.projectIds.length?linkChips(k):''}${kd?`<span class="muted" style="font-size:12px">${kd} direct task${kd>1?'s':''}</span>`:''}<button class="btn ghost sm" data-act="addTask" data-goal="${k.id}">${icon('plus')}Task</button></div></div>`; }).join('') || '<span class="muted" style="font-size:13px">No sub-goals yet. Split a large goal into steps you can track separately.</span>'}
          <button class="btn ghost sm" style="align-self:flex-start" data-act="newGoal" data-parent="${g.id}">${icon('plus')}Add sub-goal</button>
        </div></article>`; }).join('')}</div>`
      : `<div class="empty">No goals in this year yet. Create one with <b>New goal</b>.</div>`}`;
}

function parseCSV(text){
  text = text.replace(/^\ufeff/, ''); let sep;
  const m = text.match(/^sep=(.)\r?\n/i); if(m){ sep = m[1]; text = text.slice(m[0].length); }
  else { const first = text.split(/\r?\n/, 1)[0], n = c => first.split(c).length - 1; sep = n('\t')>n(',')&&n('\t')>n(';') ? '\t' : n(';')>n(',') ? ';' : ','; }
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0; i<text.length; i++){ const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q = false; } else cell += ch; }
    else if(ch==='"') q = true; else if(ch===sep){ row.push(cell); cell=''; }
    else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell += ch; }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

function rowsToObjects(rows){

  const headers = rows[h].map(v => String(v??'').trim());

}

function normDate(v){
  if(v==null || v==='') return '';
  const fromUTC = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
  if(v instanceof Date) return isNaN(v) ? null : fromUTC(new Date(v.getTime() + 12*3600e3));
  if(typeof v==='number') return v>0 && v<200000 ? fromUTC(new Date(Date.UTC(1899,11,30) + Math.round(v)*864e5)) : null;
  v = String(v).trim(); if(!v) return '';

  if((m = v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if((m = v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))){ d=+m[1]; mo=+m[2]; y=+m[3]; if(y<100) y += 2000; }

    if(!t){ t = {createdBy:viewer()?.id, assigneeId:null, collaboratorIds:[], id: fresh(id) && !N.tasks.some(x=>x.id===id) ? id : 't_'+uid(), title, projectId:null, goalId:null, due:null, status:'todo', done:false, completedAt:null, createdAt:todayISO(), notes:'', hours:null, custom:{}, subtasks:[], source:null}; N.tasks.push(t); C.tasks.add++; } else C.tasks.upd++;
    t.title = title;
    if(has(r,'Project')){ const pn = str(val(r,'Project'));
      if(!pn) t.projectId = null;
      else { let p = projByName(pn); if(!p){ p = newProject(pn); N.projects.push(p); C.projects.add++; W.push(`Created project “${pn}” (used by task “${title}”).`); } if(t.projectId!==p.id) t.source = null; t.projectId = p.id; } }
    if(has(r,'Goal')){ const gt = str(val(r,'Goal')); if(!gt) t.goalId = null; else { const g = goalByTitle(gt) || N.goals.find(x=>x.id===gt); if(g) t.goalId = g.id; else W.push(`Task “${title}”: no goal called “${gt}”, so it was not linked.`); } }
    if(has(r,'Assignee')) t.assigneeId = pid(val(r,'Assignee'), `Task “${title}”`);
    if(has(r,'Collaborators')) t.collaboratorIds = pids(val(r,'Collaborators'), `Task “${title}”`);
    const due = date(r,'Due date',title); if(due!==undefined) t.due = due || null;
    const st = lc(str(val(r,'Status'))); if(st){ const m = STATUSES.find(x => lc(x.label)===st || x.id===st) || (/done|complet|hecho/.test(st) ? STATUSES[2] : /progress|doing|curso/.test(st) ? STATUSES[1] : STATUSES[0]); t.status = m.id; t.done = m.id==='done'; }
    const ca = date(r,'Completed on',title); if(ca!==undefined) t.completedAt = ca || null;
    if(t.done && !t.completedAt) t.completedAt = t.due && t.due<=todayISO() ? t.due : todayISO(); if(!t.done) t.completedAt = null;
    if(has(r,'Hours')){ const h = str(val(r,'Hours')).replace(',','.'); if(h==='') t.hours = null; else if(isFinite(+h) && +h>=0) t.hours = +h; else W.push(`Task “${title}”: hours “${h}” is not a number.`); }
    const cr = date(r,'Created',title); if(cr) t.createdAt = cr;
    t.custom = t.custom || {};
    N.fields.forEach(f => { if(!has(r, f.name)) return; const v = val(r, f.name);
      if(f.type==='select'){ const o = optFor(f, v); if(o) t.custom[f.id] = o; else delete t.custom[f.id]; }
      else if(f.type==='date'){ const d = normDate(v); if(d) t.custom[f.id] = d; else delete t.custom[f.id]; }
      else { const sv = str(v); if(sv) t.custom[f.id] = f.type==='number' ? sv.replace(',','.') : sv; else delete t.custom[f.id]; } });
    if(has(r,'Subtasks')){ const prev = t.subtasks || []; t.subtasks = str(val(r,'Subtasks')).split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line => { const m = line.match(/^\[( |x|X)?\]\s*(.*)$/); const tt = m ? m[2] : line; const old = prev.find(x=>x.title===tt); return {id:old?old.id:uid(), title:tt, done: m ? lc(m[1]||'')==='x' : !!old?.done}; }); }
    if(has(r,'Description')) t.notes = str(val(r,'Description'));
  });
  N.goals.forEach(g => g.projectIds = g.projectIds.filter(id => N.projects.some(p=>p.id===id)));
  N.tasks.forEach(t => { if(t.goalId && !N.goals.some(g=>g.id===t.goalId)) t.goalId = null; if(t.projectId && !N.projects.some(p=>p.id===t.projectId)) t.projectId = null; });
  N.notes = N.notes.filter(n => N.projects.some(p=>p.id===n.projectId));
  return {N, W, C};
}

function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 1800); }
function openTask(id){ UI.sheet = id; UI.delConfirm = false; renderSheet(); setTimeout(()=>{ const t = task(id); if(t && !t.title) document.getElementById('d-title')?.focus(); }, 30); }
function copyText(id, okMsg){ const ta = document.getElementById(id); const fallback = () => { ta.focus(); ta.select(); toast('Selected. Press Ctrl+C to copy'); };
  try{ navigator.clipboard.writeText(ta.value).then(()=>toast(okMsg), fallback); }catch(e){ fallback(); } }
function setOpt(key, patch){ const [fid, oid] = key.split('|'); const o = fld(fid)?.options.find(o=>o.id===oid); if(o) Object.assign(o, patch); }
function loadSymbol(file){
  UI.modal.imgErr = null;
  if(!file || !/^image\//.test(file.type) && !/\.ico$/i.test(file.name)){ UI.modal.imgErr = 'That file is not an image.'; renderModal(); return; }
  if(file.size > 8*1024*1024){ UI.modal.imgErr = 'Choose an image under 8 MB.'; renderModal(); return; }
  const r = new FileReader();
  r.onload = () => { const img = new Image();
    img.onload = () => { try{
        const MAX = 192, w = img.naturalWidth || MAX, h = img.naturalHeight || MAX, k = Math.min(1, MAX/Math.max(w, h));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w*k)); c.height = Math.max(1, Math.round(h*k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        UI.modal.draft.img = c.toDataURL('image/png'); renderModal();
      }catch(e){ UI.modal.imgErr = 'This image could not be read.'; renderModal(); } };
    img.onerror = () => { UI.modal.imgErr = 'This image format is not supported by your browser.'; renderModal(); };
    img.src = r.result; };
  r.readAsDataURL(file);
}

  /* strategy */
  period(el){ UI.period = el.dataset.p; renderMain(); },
  newGoal(el){ UI.modal = {kind:'goal',id:null,draft:{ownerId:viewer()?.id,title:'',start:UI.period!=='all'?`${UI.period}-01-01`:todayISO(),end:`${UI.period!=='all'?UI.period:new Date().getFullYear()}-12-31`,openEnded:false,status:'on_track',parentId:el.dataset.parent||'',projectIds:[],manual:0,notes:''}}; renderModal(); setTimeout(()=>document.getElementById('gm-title')?.focus(),30); },
  editGoal(el){ const g = S.goals.find(g=>g.id===el.dataset.id); UI.modal = {kind:'goal',id:g.id,draft:{...g,end:g.end||'',openEnded:!g.end,parentId:g.parentId||'',projectIds:[...g.projectIds]}}; renderModal(); },
  saveGoal(){ const M = UI.modal, D = M.draft; if(!D.title.trim()){ document.getElementById('gm-title')?.focus(); return; }
    if(!D.start){ M.err = 'Choose a start date.'; renderModal(); return; }
    if(!D.openEnded && !D.end){ M.err = 'Choose an end date, or tick "No end date".'; renderModal(); return; }
    if(!D.openEnded && D.end < D.start){ M.err = 'The end date is before the start date.'; renderModal(); return; }
    const data = {ownerId:D.ownerId||viewer()?.id,title:D.title.trim(),start:D.start,end:D.openEnded?null:D.end,status:D.status,parentId:D.parentId||null,projectIds:D.projectIds,manual:+D.manual||0,notes:D.notes};
    if(M.id) Object.assign(S.goals.find(g=>g.id===M.id), data); else S.goals.push({id:'g_'+uid(),...data}); UI.modal = null; commit(); },
  delGoal(){ UI.modal.confirmDel = true; renderModal(); },
  delGoalNo(){ UI.modal.confirmDel = false; renderModal(); },
  delGoalYes(){ const id = UI.modal.id; const gone = new Set(S.goals.filter(g=>g.id===id||g.parentId===id).map(g=>g.id)); S.tasks.forEach(t=>{ if(gone.has(t.goalId)) t.goalId = null; }); S.goals = S.goals.filter(g=>!gone.has(g.id)); UI.modal = null; commit(); },
  /* backup */
  backup(){ UI.modal = {kind:'backup'}; renderModal(); },
  exportXlsx(){ exportXlsx(); },
  exportCsv(el){ exportCsv(el.dataset.k); },
  csvSep(el){ UI.csvSep = el.dataset.s; renderModal(); },
  copyTable(el){ const txt = toCSV(exportTables()[el.dataset.k], '\t').replace(/^\ufeff/,''); try{ navigator.clipboard.writeText(txt).then(()=>toast('Copied. Paste it into Excel'), ()=>toast('Copy was blocked in this view')); }catch(e){ toast('Copy was blocked in this view'); } },
  saveJson(){ saveFile(`project-backup-${stamp()}.json`, JSON.stringify(S, null, 1)); },
  impApply(){ const imp = UI.modal.imp; S = imp.res.N; const c = imp.res.C; UI.modal = null; UI.sheet = null; commit();
    toast(`Imported: ${c.tasks.add+c.tasks.upd} tasks, ${c.projects.add+c.projects.upd} projects, ${c.goals.add+c.goals.upd} goals`); },
  impCancel(){ UI.modal.imp = null; renderModal(); },
  copyBackup(){ copyText('bk-out','Backup copied'); },
  restore(){ applyBackup(document.getElementById('bk-in').value); },
  resetAsk(el){ UI.modal.reset = el.dataset.k; renderModal(); },
  resetNo(){ UI.modal.reset = null; renderModal(); },
  resetYes(){ const keepMe = person(S.settings.me), curPal = S.settings.palette; S = UI.modal.reset==='blank' ? blank() : seed(); ensurePalette(); if(curPal && curPal!=='goose' && PALETTES[curPal]) switchPalette(curPal); if(UI.modal.reset==='blank'){ S.people = [keepMe || {id:'u_me',name:'You',title:'',access:'admin',color:PERSON_COLORS[0]}]; S.teams = []; S.settings.me = S.people[0].id; } else addPeople(S); UI.viewAs = null; UI.modal = null; UI.sheet = null; UI.page='timeline'; UI.filt={project:''}; UI.tlScroll=null; commit(); toast('Done'); }
};
function applyBackup(txt){
  try{ let s = JSON.parse(txt); if(!s || ![2,3].includes(s.v) || !Array.isArray(s.tasks)) throw 0; S = migrateGoals(migrate(s)); S.settings = S.settings || {}; ensurePalette(); addPeople(S); UI.viewAs = null; UI.modal=null; UI.sheet=null; UI.page='timeline'; commit(); toast('Backup restored'); }
  catch(e){ UI.modal.err = 'That text is not a backup from this version of the app. Copy the whole backup, from the first { to the last }.'; UI.modal.paste = txt; renderModal(); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if(UI.dropAsk && !e.target.closest('#dropask')){ UI.dropAsk = null; renderDropAsk(); }
  const el = e.target.closest('[data-act]');
  if(el && A[el.dataset.act]){ A[el.dataset.act](el, e); return; }
  if(e.target.id==='scrim'){ UI.modal = null; render(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.ui==='q'){ UI.q = el.value; renderMain(); return; }
  if(el.dataset.tf==='title' || el.dataset.tf==='notes'){ task(UI.sheet)[el.dataset.tf] = el.value; save(); renderMain(); return; }
  if(el.dataset.tf==='hours'){ const t = task(UI.sheet); t.hours = el.value==='' ? null : Math.max(0, +el.value); save(); renderMain(); return; }
  if(el.dataset.draft){ if(UI.modal?.draft){ UI.modal.draft[el.dataset.draft] = el.value; if(el.dataset.draft==='manual') document.getElementById('gm-mv').textContent = el.value+'%'; } else UI.draft[el.dataset.draft] = el.value; return; }
  if(el.dataset.en){ UI.editBuf[el.dataset.en] = el.value; return; }
  if(el.dataset.nf){ UI.modal.nf[el.dataset.nf] = el.value; return; }
  if(el.dataset.dimname){ const f = fld(el.dataset.dimname); if(f && el.value.trim()){ f.name = el.value.trim(); save(); } return; }
  if(el.dataset.optlabel){ if(el.value.trim()){ setOpt(el.dataset.optlabel, {label:el.value.trim()}); save(); } return; }
  if(el.dataset.optcolor){ setOpt(el.dataset.optcolor, {color:el.value}); el.closest('.optpick').previousElementSibling.querySelector('.optsw').style.setProperty('--c', el.value); save(); return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.dimname || el.dataset.optlabel){ renderFbar(); renderMain(); return; }
  if(el.dataset.optcolor){ setOpt(el.dataset.optcolor, {color:el.value}); save(); renderModal(); renderFbar(); renderMain(); return; }
  if(el.dataset.rv){ const [a,b] = rvRange(); const r = {from:a, to:b}; r[el.dataset.rv] = el.value || r[el.dataset.rv];
    if(r.to < r.from){ if(el.dataset.rv==='from') r.to = r.from; else r.from = r.to; }
    UI.rv = {preset:'custom', from:r.from, to:r.to, inc:null, dims:UI.rv.dims}; renderMain(); return; }
  if(el.dataset.rvinc){ UI.rv.inc = el.checked; renderMain(); return; }
  if(el.dataset.teamcolor){ UI.modal.draft.color = el.value; renderModal(); return; }
  if(el.dataset.viewas){ setViewAs(el.value); return; }
  if(el.dataset.access){ UI.modal.draft.access = el.dataset.access; renderModal(); return; }
  if(el.dataset.dropaskset){ S.settings.dropAsk = el.checked; save(); return; }
  if(el.dataset.palette){ switchPalette(el.value); commit(); return; }
  if(el.dataset.filt!==undefined){ UI.filt[el.dataset.filt] = el.value; UI.tlScroll = null; render(); return; }
  if(el.dataset.ui==='showDone'){ UI.showDone = el.checked; renderMain(); return; }
  if(el.dataset.ui==='group'){ UI.group = el.value; renderMain(); return; }
  if(el.dataset.stat){ UI.stats[el.dataset.stat] = el.value; renderMain(); return; }
  if(el.dataset.nf==='type'){ UI.modal.nf.type = el.value; renderModal(); return; }
  if(el.dataset.kind){ UI.modal.draft.kind = el.dataset.kind; if(el.dataset.kind==='fixed' && !UI.modal.draft.end) UI.modal.draft.end = iso(addDays(new Date(),90)); renderModal(); return; }
  if(el.dataset.pdim){ UI.modal.draft.dims[el.dataset.pdim] = el.value || undefined; if(!el.value) delete UI.modal.draft.dims[el.dataset.pdim]; return; }
  if(el.dataset.draft && UI.modal?.draft){ UI.modal.draft[el.dataset.draft] = el.value; return; }
  if(el.dataset.draft){ UI.draft[el.dataset.draft] = el.value; return; }
  if(el.dataset.en){ UI.editBuf[el.dataset.en] = el.value; return; }
  if(el.dataset.fieldtoggle){ const D = UI.modal.draft, id = el.dataset.fieldtoggle; D.fields = el.checked ? [...D.fields, id] : D.fields.filter(x=>x!==id); return; }
  if(el.dataset.goalopen){ UI.modal.draft.openEnded = el.checked; renderModal(); return; }
  if(el.dataset.goalproj){ const D = UI.modal.draft, id = el.dataset.goalproj; D.projectIds = el.checked ? [...D.projectIds, id] : D.projectIds.filter(x=>x!==id); return; }
  if(el.id==='imp-file' && el.files.length){ importFiles([...el.files]); return; }
  if(el.dataset.impreplace){ const imp = UI.modal.imp; imp.replace = el.checked; imp.res = runImport(imp.tables, imp.replace); renderModal(); return; }
  if(el.dataset.symimg && el.files[0]){ loadSymbol(el.files[0]); return; }
  if(el.id==='bk-file' && el.files[0]){ const r = new FileReader(); r.onload = () => applyBackup(String(r.result)); r.readAsText(el.files[0]); return; }
  const t = UI.sheet && task(UI.sheet);
  if(t && el.dataset.tf && !['title','notes','hours'].includes(el.dataset.tf)){
    const k = el.dataset.tf, v = el.value || null;
    if(k==='status') setStatus(t, v); else { t[k] = v; if(k==='projectId') t.source = null; }
    commit(); return; }
  if(t && el.dataset.cf){ t.custom = t.custom || {}; if(el.value==='') delete t.custom[el.dataset.cf]; else t.custom[el.dataset.cf] = el.value; save(); renderMain(); return; }
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if(e.key==='Enter' && el.dataset.quick && el.value.trim()){ newTask({title:el.value.trim()}); el.value=''; save(); renderMain(); document.getElementById('quickadd')?.focus(); toast('Task added'); return; }
  if(e.key==='Enter' && el.dataset.subadd && el.value.trim()){ task(UI.sheet).subtasks.push({id:uid(),title:el.value.trim(),done:false}); save(); renderSheet(); renderMain(); document.getElementById('d-sub')?.focus(); return; }
  if(e.key==='Enter' && el.dataset.addopt && el.value.trim()){ const f = fld(el.dataset.addopt); f.options.push({id:uid(),label:el.value.trim(),color:PCOLORS[(f.options.length*5+1)%PCOLORS.length]}); save(); renderModal(); renderFbar(); document.getElementById('addopt-'+f.id)?.focus(); return; }
  if(e.key==='Enter' && el.dataset.tf==='title'){ e.preventDefault(); el.blur(); return; }
  if(e.key==='Enter' && (e.metaKey||e.ctrlKey) && el.id==='nb-text'){ A.noteAdd(); return; }
  if(e.key==='Escape'){ if(UI.dropAsk){ UI.dropAsk = null; renderDropAsk(); return; } if(UI.modal){ UI.modal=null; render(); } else if(UI.sheet){ UI.sheet=null; renderSheet(); } }
});
document.addEventListener('toggle', e => { const el = e.target; if(el.dataset?.crit) UI.critOpen = el.open; if(el.dataset?.gcrit) UI.gcritOpen = el.open; }, true);
document.addEventListener('dragstart', e => { const c = e.target.closest?.('[data-drag]'); if(!c) return; e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed='move'; c.classList.add('dragging'); });
document.addEventListener('dragend', () => document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over')));
document.addEventListener('dragover', e => { const z = e.target.closest?.('[data-drop]'); if(!z) return; e.preventDefault(); document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over')); z.classList.add('over'); });
document.addEventListener('drop', e => { const z = e.target.closest?.('[data-drop]'); if(!z) return; e.preventDefault();
  const t = task(e.dataTransfer.getData('text/plain')); if(!t) return;
  if(readOnly()) return;
  const [kind, val] = z.dataset.drop.split(':');
  if(kind==='date'){
    if(t.due===val) return;
    if(e.altKey){ copyTaskTo(t, val); return; }
    if(S.settings.dropAsk!==false){ UI.dropAsk = {id:t.id, date:val, x:e.clientX, y:e.clientY}; renderDropAsk(); return; }
    t.due = val; commit(); return; }
  if(kind==='status') setStatus(t, val); commit(); });
function setViewAs(id){
  UI.viewAs = id; UI.sheet = null; UI.modal = null;
  const v = person(id); UI.filt = {project:''}; if(v && ['member','manager'].includes(v.access)) UI.filt.person = id;
  if(UI.page==='project' && !projMatch(proj(UI.projectId)||{})) UI.page = 'projects';
  render(); toast(id===S.settings.me ? 'Back to your own view' : `Viewing as ${v.name}`);
}
function copyTaskTo(t, date){
  const c = JSON.parse(JSON.stringify(t));
  Object.assign(c, {id:'t_'+uid(), due:date, status:'todo', done:false, completedAt:null, hours:null, createdAt:todayISO(), source:null,
    subtasks:(t.subtasks||[]).map(x=>({id:uid(), title:x.title, done:false}))});
  S.tasks.push(c); commit(); toast(`Copied to ${fmtD(date,{weekday:'short',day:'numeric',month:'short'})}`);
}
function renderDropAsk(){
  document.getElementById('dropask')?.remove();
  const A = UI.dropAsk; if(!A) return; const t = task(A.id); if(!t){ UI.dropAsk = null; return; }
  const el = document.createElement('div'); el.id = 'dropask'; el.className = 'dropask'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Move or copy task');
  const when = fmtD(A.date,{weekday:'long',day:'numeric',month:'long'});
  el.innerHTML = `<div class="dq">“${esc(t.title)||'Untitled task'}” to <b>${when}</b></div>
    <div class="drow"><button class="btn primary sm" data-act="dropMove" id="dropask-move">Move here</button><button class="btn sm" data-act="dropCopy">Copy here</button><button class="btn sm ghost" data-act="dropCancel">Cancel</button></div>
    <div class="muted" style="font-size:12px">A copy is a new open task with the same project, goal, dimensions and subtasks. Tip: hold Alt while dropping to copy straight away.</div>`;
  document.body.appendChild(el);
  const r = el.getBoundingClientRect(), W = innerWidth, H = innerHeight;
  el.style.left = Math.max(12, Math.min(A.x + 12, W - r.width - 12)) + 'px';
  el.style.top = Math.max(12, Math.min(A.y + 12, H - r.height - 12)) + 'px';
  setTimeout(()=>document.getElementById('dropask-move')?.focus(), 0);
}
const redraw = () => { if(UI.page==='insights') renderMain(); };
try{ document.getElementById('chartjs').addEventListener('load', redraw); }catch(e){}
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw); }catch(e){}
new MutationObserver(redraw).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

try{ render(); }catch(err){ window.__bootErr(err && (err.stack||err.message) || String(err)); }
</script>
