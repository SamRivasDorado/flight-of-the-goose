name: Publish the site

# Publishes https://flightofthegoose.com on GitHub Pages on every push to main:
# the public website (website/) at the root and the app under /app/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /app/
      - name: Put the website at the root and the app under /app/
        run: |
          mkdir site
          cp -r website/. site/
          rm -f site/README.md
          mkdir site/app
          cp -r dist/. site/app/
          echo flightofthegoose.com > site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
